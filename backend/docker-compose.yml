services:
  postgres:
    image: postgres:16-alpine
    container_name: link_pulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkpulsedb
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: link_pulse_redis
    restart: always
    ports:
      - "6379:6379"